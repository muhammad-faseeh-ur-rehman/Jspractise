<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greater Number</title>
  </head>
  <body>
    <h1>Greater Number</h1>
    <input type="number" id="num1" placeholder="Enter first number" />
    <br /><br />
    <input type="number" id="num2" placeholder="Enter second number" />
    <br /><br />
    <button onclick="checkGreater()">Check</button>
    <h2 id="result"></h2>
  </body>
  <script>
    function checkGreater() {
      let num1 = Number(document.getElementById("num1").value);
      let num2 = Number(document.getElementById("num2").value);
      if (num1 > num2) {
        document.getElementById("result").innerText = num1 + " is greater";
      } else if (num2 > num1) {
        document.getElementById("result").innerText = num2 + " is greater";
      } else {
        document.getElementById("result").innerText = "Both numbers are equal";
      }
    }
  </script>
</html>
