<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grade system</title>
  </head>
  <body>
    <input type="number" id="num1" placeholder="Enter Subject 1 number!" />
    <br /><br />
    <input type="number" id="num2" placeholder="Enter Subject 2 number!" />
    <br /><br />
    <input type="number" id="num3" placeholder="Enter Subject 3 number!" />
    <br /><br />
    <input type="number" id="num4" placeholder="Enter Subject 4 number!" />
    <br /><br />
    <input type="number" id="num5" placeholder="Enter Subject 5 number!" />
    <br /><br />
    <button id="calculate">Calculate</button> <br /><br /><br />
    <div id="result"></div>
  </body>
  <script>
    let subject1 = document.querySelector("#num1");
    let subject2 = document.querySelector("#num2");
    let subject3 = document.querySelector("#num3");
    let subject4 = document.querySelector("#num4");
    let subject5 = document.querySelector("#num5");
    let result = document.querySelector("#result");
    let calculate = document.querySelector("#calculate");
    calculate.addEventListener("click", function () {
      if (
        subject1.value == "" ||
        subject2.value == "" ||
        subject3.value == "" ||
        subject4.value == "" ||
        subject5.value == ""
      ) {
        result.textContent = "Enter All the Subjects number!";
        return;
      }
      let Marks1 = Number(subject1.value);
      let Marks2 = Number(subject2.value);
      let Marks3 = Number(subject3.value);
      let Marks4 = Number(subject4.value);
      let Marks5 = Number(subject5.value);

      let total = Marks1 + Marks2 + Marks3 + Marks4 + Marks5;
      let average = total / 5;
      if (average >= 90) {
        result.textContent = `${total}  A grade`;
        return;
      } else if (average >= 80) {
        result.textContent = `${total}  B grade`;
        return;
      } else if (average >= 70) {
        result.textContent = `${total}  C grade`;
        return;
      } else if (average >= 60) {
        result.textContent = `${total}  D grade`;
        return;
      } else {
        result.textContent = `${total}  Fail`;
        return;
      }
    });
  </script>
</html>
